name: Benchmarks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_ref:
        description: Git ref (branch, tag, or SHA) to compare against
        required: false
        default: main
        type: string
      rounds:
        description: Number of interleaved A/B rounds
        required: false
        default: '3'
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: head/package-lock.json

      - name: Install head dependencies
        working-directory: head
        run: npm ci --ignore-scripts

      - name: Install base dependencies
        run: |
          if [ -f base/scripts/bench.ts ]; then
            (cd base && npm ci --ignore-scripts)
          else
            echo "Base does not contain scripts/bench.ts; skipping base install (bootstrap mode)."
          fi

      - name: Run interleaved A/B benchmarks
        working-directory: head
        env:
          ROUNDS: ${{ inputs.rounds || '3' }}
          BEFORE_LABEL: ${{ github.event.pull_request.base.ref || inputs.base_ref || 'main' }}
          AFTER_LABEL: ${{ github.head_ref || github.ref_name }}
          SUMMARY_FILE: ${{ runner.temp }}/bench-summary.md
        run: |
          npm run bench:compare -- \
            --before-dir ../base \
            --after-dir . \
            --before-label "${BEFORE_LABEL}" \
            --after-label "${AFTER_LABEL}" \
            --rounds "${ROUNDS}" \
            --warn-threshold 5 \
            --fail-threshold 10 \
            --retries 1 \
            --markdown-out "${SUMMARY_FILE}"

      - name: Publish job summary
        if: always()
        env:
          SUMMARY_FILE: ${{ runner.temp }}/bench-summary.md
        run: |
          if [ -f "${SUMMARY_FILE}" ]; then
            cat "${SUMMARY_FILE}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Post or update PR comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SUMMARY_FILE: ${{ runner.temp }}/bench-summary.md
        with:
          script: |
            const fs = require('node:fs');
            const summaryPath = process.env.SUMMARY_FILE;
            if (!summaryPath || !fs.existsSync(summaryPath)) {
              core.info('No benchmark summary file found; skipping PR comment.');
              return;
            }
            const marker = '<!-- ledger-benchmark-report -->';
            const report = fs.readFileSync(summaryPath, 'utf8').trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${report}\n\n<sub>Updated from [workflow run](${runUrl}).</sub>`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              c => c.body && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
